<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Abrindo o checkout — My Stand</title>
  <link rel="canonical" href="https://pay.kiwify.com.br/O1q91jT">
  <script src="js/posthog.js"></script>
  <script src="js/config.js?v=11"></script>
  <script>
    (function () {
      var cfg = window.MYSTAND || {};
      var url = (cfg.CHECKOUT_URL || "https://pay.kiwify.com.br/O1q91jT").trim();
      var search = location.search || "";
      var hash = location.hash || "";
      if (search && url.indexOf("?") >= 0) search = search.replace(/^\?/, "&");
      location.replace(url + search + hash);
    })();
  </script>
</head>
<body>
  <p><a id="checkout" href="https://pay.kiwify.com.br/O1q91jT">Continuar para o pagamento</a></p>
  <script>
    (function () {
      var cfg = window.MYSTAND || {};
      var url = (cfg.CHECKOUT_URL || "https://pay.kiwify.com.br/O1q91jT").trim();
      var a = document.getElementById("checkout");
      if (a) a.href = url + (location.search || "") + (location.hash || "");
    })();
  </script>
</body>
</html>
